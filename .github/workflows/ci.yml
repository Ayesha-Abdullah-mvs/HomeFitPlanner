name: CI – Build, Test & Publish

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore HomeFitPlanner.sln

      - name: Build solution (Release)
        run: dotnet build HomeFitPlanner.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test HomeFitPlanner.Tests/HomeFitPlanner.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test_results.trx"

      - name: Publish UI project
        run: |
          dotnet publish HomeFitPlanner.UI/HomeFitPlanner.UI.csproj -c Release -o publish/UI

      - name: Upload published binaries
        uses: actions/upload-artifact@v4
        with:
          name: HomeFitPlanner-binaries
          path: publish/**

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_results.trx

  deploy-pages:
    needs: build-test-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy wwwroot to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: HomeFitPlanner.Web/wwwroot
          keep_files: false
          force_orphan: true
